<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>项目内容拆解 · 真实材料 Demo</title><link rel="stylesheet" href="assets/app.css"><script src="assets/app.js" defer></script></head>
<body><div id="app">
<header class="app-header"><div><span class="eyebrow">叙事资产 · 内容整理</span><h1>项目内容拆解</h1></div><div id="project-switch" class="project-switch" role="group" aria-label="切换整个项目"></div></header>
<div class="toolbar"><div class="view-switch" role="group" aria-label="浏览方式"><button data-view="map" aria-pressed="true">项目全貌</button><button data-view="table" aria-pressed="false">素材表</button></div><label class="search"><span class="sr-only">查找当前项目素材</span><input id="search" type="search" placeholder="查找文字、任务、指标或图件"></label><span id="result-count" class="muted" aria-live="polite"></span></div>
<div id="project-root"></div><main><div id="loading" role="status">正在载入项目结构与素材…</div><section id="structure" aria-label="整个项目的三层拆解"></section><section id="search-results" class="material-section" aria-label="搜索结果" hidden></section><section id="table-view" aria-label="素材表" hidden></section><section id="object-materials" class="material-section" hidden></section><section id="material-detail" class="detail-section" aria-label="素材内容与出处" hidden></section></main>
<footer class="app-footer"><span>文字 · 任务 · 指标 · 条件 · 图件</span><span>选取材料的分层拆解；归纳内容单独标记。修改仅保存在当前浏览器。</span></footer>
</div></body></html>
