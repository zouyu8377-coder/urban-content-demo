投资和开放时段需结合校方、资产及专项条件核定；专业园区与首发项目为规划建议。", "page": "431", "doc": "JZ", "project": "jz", "quote": "4.模式选择与空间落位条件\nModel Selection and Spatial Conditions\n具体入口、路径、容量、面积、投资和开放时段需结合校方、资产及专项条件核定；专业园区与首发项目为规划建议。\n一校一策、一平台一授权表、一项目一运营合同\n校园界面承接交流，近校载体承接转化，受控平台提供能力；\n点位功能、授权条件和运营责任同步落实。"}, {"id": 33, "name": "东莞片区城市设计总平面", "type": "图件说明", "place": "总体空间", "text": "总平面图表达片区整体空间布局，并以子项目编号标注位置。此条记录只描述图件用途，不从图面推算新增指标。", "page": "27", "doc": "A", "project": "dg", "quote": "城市设计总平面图 / URBAN DESIGN MASTERPLAN\n子项目编号示例：1-2、1-4、1-1、2-1、2-2、2-3、2-4、2-5。"}, {"id": 34, "name": "都市盲盒：会商首发场景", "type": "图件说明", "place": "东莞站门户节点 / 都市盲盒", "text": "效果图展示都市盲盒的会展、商业与首发场景。此条为图件内容概述，图片保留原文标注。", "page": "49", "doc": "A", "project": "dg", "quote": "潮玩会赏快闪\n设置20个标准化快闪位，由品牌……（原文片段）"}];
