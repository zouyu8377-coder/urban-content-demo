<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="城市设计资料结构化管理的轻量原型：真实项目示例、设计思考与人机分工。">
<title>城市设计资料整理 · 产品讨论稿</title>
<style>
:root{color-scheme:light;--ink:#24372d;--dim:#63736a;--line:#dce5dc;--green:#2c6048;--soft:#edf3ed;--paper:#fff;--back:#f6f7f3}*{box-sizing:border-box}body{margin:0;background:var(--back);color:var(--ink);font:16px/1.8 system-ui,-apple-system,'Microsoft YaHei',sans-serif}a{color:var(--green);text-underline-offset:4px}header,main,footer{max-width:1160px;margin:auto;padding-left:28px;padding-right:28px}header{padding-top:48px;padding-bottom:30px}nav{display:flex;gap:24px;flex-wrap:wrap;font-size:14px;margin-bottom:30px}.eyebrow{font-size:13px;color:var(--green);letter-spacing:2px}h1{font-size:clamp(27px,4vw,42px);line-height:1.35;font-weight:600;margin:10px 0 18px}h2{font-size:24px;font-weight:600;margin:0 0 14px}h3{font-size:17px;margin:0 0 8px;font-weight:600}p{margin:0 0 16px}.lead{max-width:800px;font-size:18px;color:var(--dim)}section{padding:32px 0;border-top:1px solid var(--line);scroll-margin-top:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.block{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px}.block p{font-size:14px;color:var(--dim);margin:0}.muted{font-size:14px;color:var(--dim)}.badge{display:inline-block;font-size:12px;color:var(--green);background:var(--soft);padding:3px 9px;border-radius:5px;margin-right:6px}.callout{padding:18px 22px;border-left:3px solid var(--green);background:var(--soft);font-size:14px;margin:20px 0}.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin:18px 0}.diagram svg{display:block;width:100%;min-width:900px;height:auto}.diagram text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:var(--ink);font-size:15px}.diagram .lane{fill:#f2f5ef}.diagram .lane2{fill:#fff}.diagram .node{fill:#fff;stroke:#9eb6a6;stroke-width:1.4}.diagram .flow{fill:none;stroke:#547d64;stroke-width:1.6;marker-end:url(#arrow)}.diagram .small{font-size:12px;fill:var(--dim)}iframe{width:100%;height:1260px;display:block;border:1px solid var(--line);border-radius:10px;background:#fff}.demo-head{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.button{display:inline-block;border:1px solid var(--green);border-radius:5px;text-decoration:none;padding:7px 13px;font-size:14px}.steps{padding-left:21px;font-size:14px;color:var(--dim)}li{margin:6px 0}.feedback{font-size:15px;padding-left:23px}footer{padding-top:24px;padding-bottom:36px;font-size:12px;color:var(--dim)}@media(max-width:680px){header,main,footer{padding-left:18px;padding-right:18px}header{padding-top:28px}.grid{grid-template-columns:1fr;gap:12px}section{padding:25px 0}iframe{height:1700px}.lead{font-size:16px}nav{gap:18px}}
</style>
<style>main{padding-top:24px;padding-bottom:24px}section{padding:0;border:0}.diagram{margin:0 0 24px}#demo .demo-head{justify-content:flex-end;margin-bottom:12px}@media(max-width:680px){main{padding-top:18px;padding-bottom:18px}section{padding:0}}</style>
</head>
<body>
<main>
<section id="roles"><div class="diagram" role="img" aria-label="三条泳道：用户选择材料并修正内容，AI提取和初填字段，系统保存记录并提供查询与原文对照。手机可横向滚动。">
<svg viewBox="0 0 1080 455" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#547d64"/></marker></defs>
<rect class="lane" width="1080" height="140"/><rect class="lane2" y="140" width="1080" height="140"/><rect class="lane" y="280" width="1080" height="175"/>
<path d="M125 0V455 M0 140H1080 M0 280H1080" stroke="#dce5dc" fill="none"/>
<text x="25" y="65" font-weight="600">人类用户</text><text x="25" y="86" class="small">选择与修正</text>
<text x="25" y="207" font-weight="600">AI 助手</text><text x="25" y="228" class="small">提取与初填</text>
<text x="25" y="355" font-weight="600">资料系统</text><text x="25" y="376" class="small">保存与检索</text>
<rect class="node" x="155" y="42" width="145" height="64" rx="7"/><text x="173" y="68">① 选择项目材料</text><text x="173" y="90" class="small">明确整理范围</text>
<rect class="node" x="320" y="180" width="140" height="65" rx="7"/><text x="338" y="207">② 识别与拆分</text><text x="338" y="230" class="small">文字、表格、图件</text>
<rect class="node" x="495" y="180" width="155" height="65" rx="7"/><text x="511" y="207">③ 初填统一字段</text><text x="511" y="230" class="small">不确定处标注待确认</text>
<rect class="node" x="680" y="42" width="155" height="64" rx="7"/><text x="695" y="68">④ 按需查看和修正</text><text x="695" y="90" class="small">分类、内容、归属</text>
<rect class="node" x="680" y="318" width="155" height="70" rx="7"/><text x="695" y="345">⑤ 结构化资料表</text><text x="695" y="369" class="small">内容与来源一起保存</text>
<rect class="node" x="890" y="42" width="160" height="64" rx="7"/><text x="906" y="68">⑥ 搜索与查阅</text><text x="906" y="90" class="small">需要时继续修改</text>
<rect class="node" x="890" y="318" width="160" height="70" rx="7"/><text x="906" y="345">⑦ 内容与原文对照</text><text x="906" y="369" class="small">找到内容，也找到依据</text>
<path class="flow" d="M300 74H390V180"/><path class="flow" d="M460 212H495"/><path class="flow" d="M650 212H757V106"/>
<path class="flow" d="M757 106V165H858V300H757V318"/><path class="flow" d="M835 353H868V128H970V106"/><path class="flow" d="M970 106V318"/>
<text x="510" y="420" class="small">当前 demo：已预先完成选取内容的整理，体验资料表、编辑和原文对照。</text>
</svg></div>
</section>
<section id="demo"><div class="demo-head"><a class="button" href="demo.html" target="_blank" rel="noopener">单独打开 demo ↗</a></div>
<iframe id="demo-frame" src="demo.html" title="城市设计真实材料整理demo" loading="lazy"></iframe>
</section>
</main>
<script>
const frame=document.getElementById('demo-frame');
function resizeDemo(){try{const doc=frame.contentDocument;frame.style.height=Math.max(700,Math.ceil(doc.body.scrollHeight+24))+'px'}catch{}}
frame.addEventListener('load',()=>{resizeDemo();try{new ResizeObserver(resizeDemo).observe(frame.contentDocument.body)}catch{}});
window.addEventListener('resize',resizeDemo);
</script>
</body>
</html>
